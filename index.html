    /*******************************************************
     * Main App
     *******************************************************/
    function App() {
      const [user, setUser] = React.useState(null);
      const [authReady, setAuthReady] = React.useState(false);

      const [screen, setScreen] = React.useState('home'); // home | adminCreate | adminRoom | studentJoin | studentRoom
      const [role, setRole] = React.useState(null); // 'admin' | 'student'
      const [roomCode, setRoomCode] = React.useState('');

      const [joinRoomCode, setJoinRoomCode] = React.useState('');
      const [toastMsg, setToastMsg] = React.useState(null);
      const [modal, setModal] = React.useState(null);
      const [selectedSeatId, setSelectedSeatId] = React.useState(null);

      const [studentName, setStudentName] = React.useState('');
      const [studentGender, setStudentGender] = React.useState('M');

      const [adminRoomCode, setAdminRoomCode] = React.useState('');

      const { room, seats, students, loading: roomLoading } = useRoomData(roomCode);

      const isAdmin = React.useMemo(() => {
        if (!user || !room) return false;
        return room.adminUid === user.uid;
      }, [user, room]);

      const joinedCount = React.useMemo(() => Object.keys(students || {}).length, [students]);
      const seatCount = React.useMemo(() => Object.keys(seats || {}).length, [seats]);

      // refs (학생 모달 안정화용)
      const seatsRef = React.useRef(seats);
      const roomRefVal = React.useRef(room);
      React.useEffect(() => { seatsRef.current = seats; }, [seats]);
      React.useEffect(() => { roomRefVal.current = room; }, [room]);

      // lobby일 때 capacity sync
      const capSyncRef = React.useRef(null);
      React.useEffect(() => {
        if (!room || !isAdmin) return;
        if (room.status !== 'lobby') return;
        const desired = seatCount;
        if ((room.capacity ?? 0) === desired) return;
        if (capSyncRef.current) clearTimeout(capSyncRef.current);
        capSyncRef.current = setTimeout(async () => {
          try {
            const roomDocRef = doc(db, 'rooms', roomCode);
            await updateDoc(roomDocRef, { capacity: desired, updatedAt: serverTimestamp() });
          } catch (e) {
            console.warn('capacity sync failed', e);
          }
        }, 350);
        return () => { if (capSyncRef.current) clearTimeout(capSyncRef.current); };
      }, [room?.status, room?.capacity, seatCount, isAdmin, roomCode]);

      const mySeatId = React.useMemo(() => {
        if (!user) return null;
        const me = students?.[user.uid];
        if (me?.currentSeatId) return me.currentSeatId;
        const found = Object.values(seats || {}).find((s) => s.occupiedBy === user.uid);
        return found?.id ?? null;
      }, [seats, students, user]);

      // auth init
      React.useEffect(() => {
        const init = async () => {
          try {
            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
              await signInWithCustomToken(auth, window.__initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.error('Auth init failed', e);
          }
        };
        init();

        const unsub = onAuthStateChanged(auth, (u) => {
          setUser(u);
          setAuthReady(true);
        });
        return () => unsub();
      }, []);

      const alertModal = (title, message) => new Promise((resolve) => setModal({ title, message, type: 'alert', resolve }));
      const confirmModal = (title, message) => new Promise((resolve) => setModal({ title, message, type: 'confirm', resolve }));

      const closeModal = (result) => {
        if (modal?.resolve) modal.resolve(result);
        setModal(null);
      };

      /*******************************************************
       * Firestore actions
       *******************************************************/
      const createRoom = async () => {
        const code = normalizeRoomCode(adminRoomCode);

        if (!isValidRoomCode(code)) {
          return alertModal('교실 코드', '교실 코드는 영문 대문자/숫자 3~12자로 입력해주세요.');
        }

        try {
          const roomDocRef = doc(db, 'rooms', code);
          const snap = await getDoc(roomDocRef);

          // ✅ 이미 존재하면: 입장
          if (snap.exists()) {
            const data = snap.data();
            if (data.adminUid && user?.uid && data.adminUid !== user.uid) {
              return alertModal('관리자 권한 없음', '이미 생성된 교실이지만, 이 교실의 관리자가 아닙니다.');
            }

            toast(setToastMsg, `기존 교실로 입장: ${code}`);
            setRoomCode(code);
            setRole('admin');
            setScreen('adminRoom');
            return;
          }

          // ✅ 없으면: 새로 생성
          await setDoc(roomDocRef, {
            code,
            adminUid: user.uid,
            capacity: 0,
            status: 'lobby',
            countdownSeconds: 10,
            auctionEnabled: false,
            auctionLockMs: DEFAULT_AUCTION_LOCK_MS,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
          });

          toast(setToastMsg, `교실 생성 완료: ${code}`);
          setRoomCode(code);
          setRole('admin');
          setScreen('adminRoom');

        } catch (e) {
          console.error('createRoom failed:', e);
          return alertModal(
            '교실 생성 실패',
            `에러: ${e?.code || e?.message || 'unknown'}\n\n(대부분 Firestore Rules 권한 문제입니다)`
          );
        }
      };

      const ensureStudentDoc = async (code, name, gender) => {
        const c = normalizeRoomCode(code);
        const n = (name || '').trim().slice(0, 12);

        if (!isValidRoomCode(c)) {
          await alertModal('교실 코드', '교실 코드는 영문 대문자/숫자 3~12자로 입력해주세요.');
          return false;
        }
        if (!n) {
          await alertModal('이름', '이름을 입력해주세요.');
          return false;
        }
        if (gender !== 'M' && gender !== 'F') {
          await alertModal('성별', '성별을 선택해주세요.');
          return false;
        }

        const roomDocRef = doc(db, 'rooms', c);
        const roomSnap = await getDoc(roomDocRef);
        if (!roomSnap.exists()) {
          await alertModal('교실 없음', '해당 교실 코드를 찾을 수 없습니다.');
          return false;
        }

        const studentRef = doc(db, 'rooms', c, 'students', user.uid);
        await setDoc(
          studentRef,
          { name: n, gender, currentSeatId: null, joinedAt: serverTimestamp() },
          { merge: true }
        );

        setRoomCode(c);
        setRole('student');
        setScreen('studentRoom');
        return true;
      };

      const addSeat = async () => {
        if (!isAdmin) return;
        if (room?.status && room.status !== 'lobby') {
          return alertModal('추가 불가', '대기중(lobby)일 때만 책상을 추가할 수 있어요.');
        }

        const taken = new Set(
          Object.values(seats || {}).map((s) => {
            const { row, col } = getCellFromXY(s.x, s.y);
            return `${row},${col}`;
          })
        );

        let found = null;
        for (let r = 0; r < GRID_ROWS; r++) {
          for (let c = 0; c < GRID_COLS; c++) {
            if (!taken.has(`${r},${c}`)) { found = { r, c }; break; }
          }
          if (found) break;
        }

        if (!found) return alertModal('추가 불가', '6x5 표(30칸)가 모두 찼습니다.');

        const id = `S${nowMs().toString(36).toUpperCase()}`;
        const seatRef = doc(db, 'rooms', roomCode, 'seats', id);
        const pos = xyFromCell(found.r, found.c);

        await setDoc(seatRef, {
          id,
          x: pos.x,
          y: pos.y,
          restriction: 'A',
          occupiedBy: null,
          occupiedName: null,
          occupiedGender: null,
          minPrice: 0,
          price: 0,
          bidLock: null,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        });
        toast(setToastMsg, '책상을 추가했어요.');
      };

      const autoLayout = async () => {
        if (!isAdmin) return;
        if (room?.status && room.status !== 'lobby') {
          return alertModal('자동 배치 불가', '대기중(lobby)일 때만 자동 배치를 사용할 수 있어요.');
        }
        const ok = await confirmModal('자동 배치', `빈 칸에 책상을 채웁니다.\n최대 6x5(30칸)까지 배치됩니다.`);
        if (!ok) return;

        const taken = new Set(
          Object.values(seats || {}).map((s) => {
            const { row, col } = getCellFromXY(s.x, s.y);
            return `${row},${col}`;
          })
        );

        const target = GRID_COLS * GRID_ROWS;
        let created = 0;

        for (let r = 0; r < GRID_ROWS; r++) {
          for (let c = 0; c < GRID_COLS; c++) {
            if (created >= target) break;
            const key = `${r},${c}`;
            if (taken.has(key)) continue;

            const id = `S${(nowMs() + created).toString(36).toUpperCase()}`;
            const seatRef = doc(db, 'rooms', roomCode, 'seats', id);
            const pos = xyFromCell(r, c);

            await setDoc(seatRef, {
              id,
              x: pos.x,
              y: pos.y,
              restriction: 'A',
              occupiedBy: null,
              occupiedName: null,
              occupiedGender: null,
              minPrice: 0,
              price: 0,
              bidLock: null,
              createdAt: serverTimestamp(),
              updatedAt: serverTimestamp(),
            });
            taken.add(key);
            created++;
          }
          if (created >= target) break;
        }

        toast(setToastMsg, `자동 배치를 완료했어요. (+${created}개)`);
      };

      const updateSeat = async (seatId, patch) => {
        if (!isAdmin) return;
        const seatRef = doc(db, 'rooms', roomCode, 'seats', seatId);
        await updateDoc(seatRef, { ...patch, updatedAt: serverTimestamp() });
      };

      const deleteSeat = async (seatId) => {
        if (!isAdmin) return;
        const s = seats?.[seatId];
        const label = s ? seatDisplayText(s) : seatId;
        const ok = await confirmModal('책상 삭제', `${label} 책상을 삭제할까요?`);
        if (!ok) return;
        const seatRef = doc(db, 'rooms', roomCode, 'seats', seatId);
        await deleteDoc(seatRef);
        toast(setToastMsg, '삭제했어요.');
      };

      const swapSeats = async (aId, bId) => {
        if (!isAdmin) return;
        if (!aId || !bId || aId === bId) return;

        const aRef = doc(db, 'rooms', roomCode, 'seats', aId);
        const bRef = doc(db, 'rooms', roomCode, 'seats', bId);

        try {
          await runTransaction(db, async (tx) => {
            const aSnap = await tx.get(aRef);
            const bSnap = await tx.get(bRef);
            if (!aSnap.exists() || !bSnap.exists()) throw new Error('SEAT_NOT_FOUND');

            const a = aSnap.data();
            const b = bSnap.data();

            const ax = a.x ?? GRID_MARGIN;
            const ay = a.y ?? GRID_MARGIN;
            const bx = b.x ?? GRID_MARGIN;
            const by = b.y ?? GRID_MARGIN;

            tx.update(aRef, { x: bx, y: by, updatedAt: serverTimestamp() });
            tx.update(bRef, { x: ax, y: ay, updatedAt: serverTimestamp() });
          });
        } catch (e) {
          console.error('swapSeats failed', e);
          await alertModal('스왑 실패', `책상 위치 교환에 실패했습니다.\n\ncode: ${e?.code || '-'}\nmsg: ${e?.message || '-'}`);
        }
      };

      const cycleRestriction = async (seatId) => {
        if (!isAdmin) return;
        const s = seats?.[seatId];
        if (!s) return;
        const cur = s.restriction || 'A';
        const next = cur === 'A' ? 'M' : cur === 'M' ? 'F' : 'A';
        await updateSeat(seatId, { restriction: next });
      };

      const startTicketing = async () => {
        if (!isAdmin) return;
        if (!room) return;

        if (seatCount <= 0) {
          return alertModal('책상 없음', '먼저 책상을 1개 이상 배치해주세요.');
        }

        if (joinedCount > seatCount) {
          const ok = await confirmModal(
            '좌석이 부족합니다',
            `입장 ${joinedCount}명 / 책상 ${seatCount}개 입니다.\n일부 학생이 자리를 선택하지 못할 수 있어요.\n그래도 시작할까요?`
          );
          if (!ok) return;
        }

        const roomDocRef = doc(db, 'rooms', roomCode);
        await updateDoc(roomDocRef, {
          status: 'countdown',
          countdownStartedAt: serverTimestamp(),
        });
        toast(setToastMsg, '티켓팅 카운트다운 시작!');
      };

      const openSeatingNow = async () => {
        if (!isAdmin) return;
        const roomDocRef = doc(db, 'rooms', roomCode);
        await updateDoc(roomDocRef, {
          status: 'seating',
          seatingStartedAt: serverTimestamp(),
        });
      };

      const pauseSeating = async () => {
        if (!isAdmin) return;
        const ok = await confirmModal('일시정지', '일시정지하면 학생들은 더 이상 선택/변경할 수 없습니다.\n(현재 상태는 그대로 유지됩니다)\n일시정지할까요?');
        if (!ok) return;

        const roomDocRef = doc(db, 'rooms', roomCode);
        await updateDoc(roomDocRef, {
          status: 'paused',
          pausedAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        });

        // (권장) 입찰 잠금 해제
        try {
          const list = Object.values(seatsRef.current || {});
          await Promise.all(list.map((s) => {
            if (!s?.bidLock) return Promise.resolve();
            const seatDocRef = doc(db, 'rooms', roomCode, 'seats', s.id);
            return updateDoc(seatDocRef, { bidLock: null, updatedAt: serverTimestamp() });
          }));
        } catch (e) {}

        toast(setToastMsg, '일시정지 했어요.');
      };

      const resumeSeating = async () => {
        if (!isAdmin) return;
        const ok = await confirmModal('배치 재개', '배치를 다시 시작할까요?\n(현재 자리 상태는 그대로 유지됩니다)');
        if (!ok) return;

        const roomDocRef = doc(db, 'rooms', roomCode);
        await updateDoc(roomDocRef, {
          status: 'seating',
          seatingResumedAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        });
        toast(setToastMsg, '배치를 다시 시작했어요!');
      };

      const toggleAuction = async () => {
        if (!isAdmin || !room) return;
        const ok = await confirmModal(
          '경매 모드 변경',
          `경매 모드를 ${(room.auctionEnabled ? 'OFF' : 'ON')} 하시겠어요?\n\nON이면 학생은 "입찰"로 자리를 구매합니다.\nOFF이면 기존처럼 그냥 클릭해서 자리를 선택합니다.`
        );
        if (!ok) return;
        const roomDocRef = doc(db, 'rooms', roomCode);
        await updateDoc(roomDocRef, {
          auctionEnabled: !(room.auctionEnabled === true),
          updatedAt: serverTimestamp(),
        });
        toast(setToastMsg, `경매 모드 ${(room.auctionEnabled ? 'OFF' : 'ON')}`);
      };

      /*******************************************************
       * ✅ 학생 자리 선택 (선착순 모드)
       *******************************************************/
      const pickInFlightRef = React.useRef(false);
      const pickLockUntilRef = React.useRef(0);

      const studentPickSeat = async (seatId) => {
        if (!user || !room) return;
        if (role !== 'student') return;

        if (pickInFlightRef.current) return;
        if (nowMs() < (pickLockUntilRef.current || 0)) return;

        if (room.status !== 'seating') {
          return alertModal('아직 선택 불가', '관리자가 배치를 시작(재개)해야 자리를 선택할 수 있어요.');
        }

        pickInFlightRef.current = true;

        const seatDocRef = doc(db, 'rooms', roomCode, 'seats', seatId);
        const studentDocRef = doc(db, 'rooms', roomCode, 'students', user.uid);
        const roomDocRef = doc(db, 'rooms', roomCode);

        try {
          await runTransaction(db, async (tx) => {
            const roomSnap = await tx.get(roomDocRef);
            if (!roomSnap.exists()) throw new Error('ROOM_NOT_FOUND');
            const roomData = roomSnap.data();
            if (roomData.status !== 'seating') throw new Error('NOT_SEATING');

            const stSnap = await tx.get(studentDocRef);
            if (!stSnap.exists()) throw new Error('NOT_JOINED');
            const st = stSnap.data();

            const sSnap = await tx.get(seatDocRef);
            if (!sSnap.exists()) throw new Error('SEAT_NOT_FOUND');
            const s = sSnap.data();

            if (s.occupiedBy) throw new Error('OCCUPIED');

            const r = s.restriction || 'A';
            if (r === 'M' && st.gender !== 'M') throw new Error('RESTRICT_M');
            if (r === 'F' && st.gender !== 'F') throw new Error('RESTRICT_F');

            const prevSeatId = st.currentSeatId || null;
            if (prevSeatId && prevSeatId === seatId) return;

            if (prevSeatId) {
              const prevRef = doc(db, 'rooms', roomCode, 'seats', prevSeatId);
              const prevSnap = await tx.get(prevRef);
              if (prevSnap.exists()) {
                const prev = prevSnap.data();
                if (prev.occupiedBy === user.uid) {
                  tx.update(prevRef, {
                    occupiedBy: null,
                    occupiedName: null,
                    occupiedGender: null,
                    updatedAt: serverTimestamp(),
                  });
                }
              }
            }

            tx.update(seatDocRef, {
              occupiedBy: user.uid,
              occupiedName: st.name,
              occupiedGender: st.gender,
              updatedAt: serverTimestamp(),
            });

            tx.update(studentDocRef, {
              currentSeatId: seatId,
              updatedAt: serverTimestamp(),
            });
          });

          toast(setToastMsg, '자리 선택 완료!');
          pickLockUntilRef.current = nowMs() + 1000;
        } catch (e) {
          const msg =
            e.message === 'OCCUPIED' ? '이미 누군가 앉아 있어요.' :
            e.message === 'RESTRICT_M' ? '이 자리는 남학생만 앉을 수 있어요.' :
            e.message === 'RESTRICT_F' ? '이 자리는 여학생만 앉을 수 있어요.' :
            e.message === 'NOT_SEATING' ? '지금은 선택 시간이 아니에요.' :
            e.message === 'NOT_JOINED' ? '먼저 교실에 입장해주세요.' :
            `선택에 실패했어요.\n\ncode: ${e?.code || '-'}\nmsg: ${e?.message || '-'}`;

          await alertModal('선택 불가', msg);
        } finally {
          pickInFlightRef.current = false;
        }
      };

      /*******************************************************
       * ✅ 경매 모드: 잠금 획득/해제 + 입찰 제출
       *******************************************************/
      const [auctionOpen, setAuctionOpen] = React.useState(false);
      const [auctionSeatId, setAuctionSeatId] = React.useState(null);
      const [auctionBusy, setAuctionBusy] = React.useState(false);

      const auctionGraceUntilRef = React.useRef(0);
      const lastAuctionSeatRef = React.useRef(null);
      const initialBidRef = React.useRef(0);

      const me = user ? students?.[user.uid] : null;

      const computeMinBid = React.useCallback((seat) => {
        const curPrice = Number(seat?.price || 0);
        const minPrice = Number(seat?.minPrice || 0);
        let minBid = Math.max(curPrice, minPrice);

        const occupiedBy = seat?.occupiedBy || null;
        if (occupiedBy && occupiedBy !== user?.uid) {
          minBid = Math.max(minBid, curPrice + BID_STEP);
        }
        return roundUpTo10(minBid);
      }, [user?.uid]);

      const acquireSeatBidLock = async (seatId) => {
        if (!user || !room) return false;
        const lockMs = Number(room.auctionLockMs || DEFAULT_AUCTION_LOCK_MS);
        const seatDocRef = doc(db, 'rooms', roomCode, 'seats', seatId);
        const stDocRef = doc(db, 'rooms', roomCode, 'students', user.uid);

        try {
          await runTransaction(db, async (tx) => {
            const roomSnap = await tx.get(doc(db, 'rooms', roomCode));
            if (!roomSnap.exists()) throw new Error('ROOM_NOT_FOUND');
            const roomData = roomSnap.data();
            if (roomData.status !== 'seating') throw new Error('NOT_SEATING');
            if (!roomData.auctionEnabled) throw new Error('NOT_AUCTION');

            const stSnap = await tx.get(stDocRef);
            if (!stSnap.exists()) throw new Error('NOT_JOINED');
            const st = stSnap.data();

            const sSnap = await tx.get(seatDocRef);
            if (!sSnap.exists()) throw new Error('SEAT_NOT_FOUND');
            const s = sSnap.data();

            const r = s.restriction || 'A';
            if (r === 'M' && st.gender !== 'M') throw new Error('RESTRICT_M');
            if (r === 'F' && st.gender !== 'F') throw new Error('RESTRICT_F');

            const lock = s.bidLock || null;
            const active = isLockActive(lock);
            const lockedByOther = active && lock?.uid && lock.uid !== user.uid;
            if (lockedByOther) throw new Error('LOCKED');

            const expiresAt = Timestamp.fromMillis(nowMs() + lockMs);
            tx.update(seatDocRef, {
              bidLock: { uid: user.uid, name: st.name || '학생', expiresAt },
              updatedAt: serverTimestamp(),
            });
          });

          return true;
        } catch (e) {
          const msg =
            e.message === 'LOCKED' ? '다른 학생이 이 자리를 입찰 중입니다.' :
            e.message === 'RESTRICT_M' ? '이 자리는 남학생만 입찰할 수 있어요.' :
            e.message === 'RESTRICT_F' ? '이 자리는 여학생만 입찰할 수 있어요.' :
            e.message === 'NOT_AUCTION' ? '경매 모드가 아닙니다.' :
            e.message === 'NOT_SEATING' ? '지금은 입찰할 수 없어요.' :
            '잠금 획득에 실패했어요.';
          await alertModal('입찰 불가', msg);
          return false;
        }
      };

      const releaseSeatBidLock = async (seatId) => {
        if (!user || !seatId) return;
        try {
          const seatDocRef = doc(db, 'rooms', roomCode, 'seats', seatId);
          await runTransaction(db, async (tx) => {
            const sSnap = await tx.get(seatDocRef);
            if (!sSnap.exists()) return;
            const s = sSnap.data();
            const lock = s.bidLock || null;
            if (lock?.uid !== user.uid) return;
            tx.update(seatDocRef, { bidLock: null, updatedAt: serverTimestamp() });
          });
        } catch (e) {}
      };

      const submitSeatBid = async (seatId, amountStr) => {
        if (!user || !room) throw new Error('NO_USER');
        const seatDocRef = doc(db, 'rooms', roomCode, 'seats', seatId);
        const studentDocRef = doc(db, 'rooms', roomCode, 'students', user.uid);
        const roomDocRef = doc(db, 'rooms', roomCode);

        const bid = Number(amountStr);

        await runTransaction(db, async (tx) => {
          const roomSnap = await tx.get(roomDocRef);
          if (!roomSnap.exists()) throw new Error('ROOM_NOT_FOUND');
          const roomData = roomSnap.data();
          if (roomData.status !== 'seating') throw new Error('NOT_SEATING');
          if (!roomData.auctionEnabled) throw new Error('NOT_AUCTION');

          const stSnap = await tx.get(studentDocRef);
          if (!stSnap.exists()) throw new Error('NOT_JOINED');
          const st = stSnap.data();

          const sSnap = await tx.get(seatDocRef);
          if (!sSnap.exists()) throw new Error('SEAT_NOT_FOUND');
          const s = sSnap.data();

          const lock = s.bidLock || null;
          const active = isLockActive(lock);
          if (!active || lock?.uid !== user.uid) throw new Error('NO_LOCK');

          const r = s.restriction || 'A';
          if (r === 'M' && st.gender !== 'M') throw new Error('RESTRICT_M');
          if (r === 'F' && st.gender !== 'F') throw new Error('RESTRICT_F');

          const curPrice = Number(s.price || 0);
          const minPrice = Number(s.minPrice || 0);

          let minBid = Math.max(curPrice, minPrice);
          const occupiedBy = s.occupiedBy || null;
          if (occupiedBy && occupiedBy !== user.uid) {
            minBid = Math.max(minBid, curPrice + BID_STEP);
          }
          minBid = roundUpTo10(minBid);

          // ✅ 서버에서도 최종 방어
          if (bid < minBid) throw new Error('BID_TOO_LOW');

          // ✅ 이전 내 자리 비우기
          const prevSeatId = st.currentSeatId || null;
          if (prevSeatId && prevSeatId !== seatId) {
            const prevRef = doc(db, 'rooms', roomCode, 'seats', prevSeatId);
            const prevSnap = await tx.get(prevRef);
            if (prevSnap.exists()) {
              const prev = prevSnap.data();
              if (prev.occupiedBy === user.uid) {
                tx.update(prevRef, {
                  occupiedBy: null,
                  occupiedName: null,
                  occupiedGender: null,
                  updatedAt: serverTimestamp(),
                });
              }
            }
          }

          // ✅ 이 자리가 다른 학생 소유였으면 그 학생 currentSeatId 정리
          if (occupiedBy && occupiedBy !== user.uid) {
            const occStRef = doc(db, 'rooms', roomCode, 'students', occupiedBy);
            const occSnap = await tx.get(occStRef);
            if (occSnap.exists()) {
              const occ = occSnap.data();
              if (occ.currentSeatId === seatId) {
                tx.update(occStRef, { currentSeatId: null, updatedAt: serverTimestamp() });
              }
            }
          }

          // ✅ 자리 소유 + 가격 + 잠금 해제
          tx.update(seatDocRef, {
            occupiedBy: user.uid,
            occupiedName: st.name,
            occupiedGender: st.gender,
            price: bid,
            bidLock: null,
            updatedAt: serverTimestamp(),
          });

          // ✅ 학생 currentSeatId 업데이트
          tx.update(studentDocRef, {
            currentSeatId: seatId,
            updatedAt: serverTimestamp(),
          });
        });
      };

      const openAuctionForSeat = async (seatId) => {
        if (!room?.auctionEnabled) return;
        if (room.status !== 'seating') {
          await alertModal('아직 선택 불가', '관리자가 배치를 시작(재개)해야 자리를 선택할 수 있어요.');
          return;
        }

        const ok = await acquireSeatBidLock(seatId);
        if (!ok) return;

        setAuctionSeatId(seatId);
        setAuctionOpen(true);

        // ✅ 초기 입찰값(열 때 한 번만 설정)
        const seatNow = seatsRef.current?.[seatId] || null;
        const minBidNow = computeMinBid(seatNow);
        initialBidRef.current = minBidNow;

        // ✅ 스냅샷 반영 유예
        auctionGraceUntilRef.current = nowMs() + 1200;
      };

      const closeAuction = async () => {
        const sid = auctionSeatId;
        setAuctionOpen(false);
        setAuctionSeatId(null);
        setAuctionBusy(false);
        if (sid) await releaseSeatBidLock(sid);
      };

      // ✅ 모달이 열려있으면 “좌석 스냅샷”을 ref로 보관 (잠깐 undefined되어도 모달 유지)
      React.useEffect(() => {
        if (!auctionOpen) return;
        if (!auctionSeatId) return;
        const cur = seats?.[auctionSeatId] || null;
        if (cur) lastAuctionSeatRef.current = cur;
      }, [auctionOpen, auctionSeatId, seats]);

      // ✅ 모달 자동 종료/안내 (모달이 열려 있을 때만 0.5초 체크 / seatsRef로 확인)
      React.useEffect(() => {
        if (!auctionOpen) return;

        const t = setInterval(() => {
          const r = roomRefVal.current;
          const uid = user?.uid;
          if (!r || !uid) return;

          // seating이 아니면 바로 닫기(일시정지 포함)
          if (r.status !== 'seating') {
            setAuctionOpen(false);
            setAuctionSeatId(null);
            setAuctionBusy(false);
            return;
          }

          if (!auctionSeatId) return;

          // 오픈 직후 유예
          if (nowMs() < (auctionGraceUntilRef.current || 0)) return;

          const curSeat = seatsRef.current?.[auctionSeatId] || lastAuctionSeatRef.current || null;
          const lock = curSeat?.bidLock || null;
          const active = isLockActive(lock);
          const mine = lock?.uid === uid;

          if (!curSeat || !active || !mine) {
            setAuctionOpen(false);
            setAuctionSeatId(null);
            setAuctionBusy(false);
            setTimeout(() => {
              alertModal('입찰 종료', '입찰 시간이 만료되었거나 잠금이 해제되었습니다.\n다시 좌석을 클릭해 주세요.');
            }, 0);
          }
        }, 500);

        return () => clearInterval(t);
      }, [auctionOpen, auctionSeatId, user?.uid]);

      /*******************************************************
       * 관리자 자리 조정(학생 이동)
       *******************************************************/
      const adminAssignModeRef = React.useRef({ enabled: false, studentUid: null });
      const [adminAssignEnabled, setAdminAssignEnabled] = React.useState(false);
      const [adminSelectedStudentUid, setAdminSelectedStudentUid] = React.useState(null);

      React.useEffect(() => {
        adminAssignModeRef.current = { enabled: adminAssignEnabled, studentUid: adminSelectedStudentUid };
      }, [adminAssignEnabled, adminSelectedStudentUid]);

      const adminAssignSeat = async (seatId) => {
        if (!isAdmin) return;
        const stUid = adminAssignModeRef.current.studentUid;
        if (!adminAssignModeRef.current.enabled || !stUid) return;

        const target = seats?.[seatId];
        if (!target) return;

        const oldSeatId = Object.values(seats || {}).find((s) => s.occupiedBy === stUid)?.id ?? null;
        const targetOccUid = target.occupiedBy || null;
        const st = students?.[stUid];
        if (!st) return;

        const ok = await confirmModal('관리자 이동', `학생(${st.name})을(를) ${seatDisplayText(target)} 자리로 이동할까요?${targetOccUid ? '\n(현재 자리 사용 중인 학생과 자리 교환됩니다)' : ''}`);
        if (!ok) return;

        try {
          await runTransaction(db, async (tx) => {
            const roomSnap = await tx.get(doc(db, 'rooms', roomCode));
            if (!roomSnap.exists()) throw new Error('ROOM_NOT_FOUND');

            const seatRef = doc(db, 'rooms', roomCode, 'seats', seatId);
            const seatSnap = await tx.get(seatRef);
            if (!seatSnap.exists()) throw new Error('SEAT_NOT_FOUND');

            const updates = [];

            if (oldSeatId && oldSeatId !== seatId) {
              const oldRef = doc(db, 'rooms', roomCode, 'seats', oldSeatId);
              const oldSnap = await tx.get(oldRef);
              if (oldSnap.exists() && oldSnap.data().occupiedBy === stUid) {
                updates.push([oldRef, { occupiedBy: null, occupiedName: null, occupiedGender: null, updatedAt: serverTimestamp() }]);
              }
            }

            if (targetOccUid) {
              const occStudentRef = doc(db, 'rooms', roomCode, 'students', targetOccUid);
              const occSnap = await tx.get(occStudentRef);
              const occ = occSnap.exists() ? occSnap.data() : null;

              if (oldSeatId && oldSeatId !== seatId) {
                const swapRef = doc(db, 'rooms', roomCode, 'seats', oldSeatId);
                updates.push([swapRef, {
                  occupiedBy: targetOccUid,
                  occupiedName: occ?.name ?? '학생',
                  occupiedGender: occ?.gender ?? null,
                  updatedAt: serverTimestamp(),
                }]);

                updates.push([occStudentRef, { currentSeatId: oldSeatId, updatedAt: serverTimestamp() }]);
              }
            }

            updates.push([seatRef, {
              occupiedBy: stUid,
              occupiedName: st.name,
              occupiedGender: st.gender,
              updatedAt: serverTimestamp(),
            }]);

            const stRef = doc(db, 'rooms', roomCode, 'students', stUid);
            updates.push([stRef, { currentSeatId: seatId, updatedAt: serverTimestamp() }]);

            for (const [ref, data] of updates) tx.update(ref, data);
          });

          toast(setToastMsg, '관리자 이동 완료');
        } catch (e) {
          console.error(e);
          await alertModal('실패', `이동에 실패했습니다.\n\ncode: ${e?.code || '-'}\nmsg: ${e?.message || '-'}`);
        }
      };

      /*******************************************************
       * Countdown timer (admin auto-open)
       *******************************************************/
      const [countdownLeft, setCountdownLeft] = React.useState(null);

      React.useEffect(() => {
        if (!room) return;
        if (room.status !== 'countdown') {
          setCountdownLeft(null);
          return;
        }

        let interval = null;
        const tick = async () => {
          const startedAt = room.countdownStartedAt?.toMillis?.() ?? null;
          const sec = room.countdownSeconds ?? 10;
          if (!startedAt) {
            setCountdownLeft(sec);
            return;
          }
          const elapsed = Math.floor((nowMs() - startedAt) / 1000);
          const left = clamp(sec - elapsed, 0, sec);
          setCountdownLeft(left);

          if (left <= 0 && isAdmin) {
            await openSeatingNow();
          }
        };

        tick();
        interval = setInterval(tick, 300);
        return () => interval && clearInterval(interval);
      }, [room?.status, room?.countdownStartedAt, room?.countdownSeconds, isAdmin]);

      /*******************************************************
       * UI
       *******************************************************/
      if (!authReady) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="bg-white rounded-2xl shadow-sm border border-stone-200 p-6 text-center">
              <div className="text-lg font-black">접속 중...</div>
              <div className="text-sm text-stone-600 mt-2">Firebase 인증을 준비하고 있어요.</div>
            </div>
          </div>
        );
      }

      const TopBar = () => (
        <div className="max-w-6xl mx-auto px-4 pt-6 pb-4">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-2xl font-black">자리 티켓팅</div>
              <div className="text-sm text-stone-600">교실 코드로 입장해서, 지정된 시간에 자리를 선택합니다.</div>
            </div>
            <div className="text-right">
              <div className="text-xs text-stone-500">내 UID</div>
              <div className="text-xs font-mono text-stone-700">{user?.uid?.slice(0, 10)}…</div>
            </div>
          </div>
        </div>
      );

      const Home = () => (
        <div className="max-w-3xl mx-auto px-4 pb-10">
          <Card title="모드 선택">
            <div className="grid md:grid-cols-2 gap-4">
              <button
                className="p-5 rounded-2xl border-2 border-sky-200 bg-sky-50 hover:bg-sky-100 text-left"
                onClick={() => { setRole('admin'); setRoomCode(''); setJoinRoomCode(''); setStudentName(''); setAdminRoomCode(''); setScreen('adminCreate'); }}
              >
                <div className="text-lg font-black">관리자</div>
                <div className="text-sm text-stone-700 mt-1">교실 생성/입장 · 자리 배치 · 티켓팅 시작/일시정지/재개 · 학생 자리 조정 · (경매 모드)</div>
              </button>
              <button
                className="p-5 rounded-2xl border-2 border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-left"
                onClick={() => { setRole('student'); setRoomCode(''); setJoinRoomCode(''); setStudentName(''); setAdminRoomCode(''); setScreen('studentJoin'); }}
              >
                <div className="text-lg font-black">학생</div>
                <div className="text-sm text-stone-700 mt-1">교실 코드로 입장 · 이름/성별 입력 · (선착순/경매) 모드에 따라 자리 선택</div>
              </button>
            </div>
          </Card>

          <div className="mt-5 text-xs text-stone-500">
            * 단일 HTML(React+Babel) 프로토타입입니다. 운영 배포 시 번들링/호스팅/보안 점검을 권장합니다.
          </div>
        </div>
      );

      const StatusBadge = ({ status }) => {
        const meta =
          status === 'lobby' ? { text: '대기중', cls: 'bg-stone-200 text-stone-700' } :
          status === 'countdown' ? { text: '카운트다운', cls: 'bg-amber-200 text-amber-900' } :
          status === 'seating' ? { text: '선택중', cls: 'bg-emerald-200 text-emerald-900' } :
          status === 'paused' ? { text: '일시정지', cls: 'bg-slate-200 text-slate-900' } :
          { text: status, cls: 'bg-stone-200 text-stone-700' };
        return <span className={`px-3 py-1 rounded-full text-xs font-black ${meta.cls}`}>{meta.text}</span>;
      };

      const AdminRoom = () => {
        if (roomLoading) {
          return (
            <div className="max-w-3xl mx-auto px-4 pb-10">
              <div className="text-center py-10 text-stone-600">불러오는 중...</div>
            </div>
          );
        }
        if (!room) {
          return (
            <div className="max-w-3xl mx-auto px-4 pb-10">
              <Card title="교실을 찾을 수 없음">
                <div className="text-stone-700">교실 코드({roomCode})가 존재하지 않습니다.</div>
                <button onClick={() => { setScreen('home'); setRoomCode(''); }} className="mt-4 px-4 py-2 rounded-xl bg-stone-200 hover:bg-stone-300 font-black">홈으로</button>
              </Card>
            </div>
          );
        }
        if (!isAdmin) {
          return (
            <div className="max-w-3xl mx-auto px-4 pb-10">
              <Card title="관리자 권한 없음">
                <div className="text-stone-700">이 교실의 관리자 UID와 현재 UID가 달라요.</div>
                <button onClick={() => { setScreen('home'); setRoomCode(''); }} className="mt-4 px-4 py-2 rounded-xl bg-stone-200 hover:bg-stone-300 font-black">홈으로</button>
              </Card>
            </div>
          );
        }

        const selectedSeat = selectedSeatId ? seats?.[selectedSeatId] : null;
        const auctionEnabled = room.auctionEnabled === true;

        const [minPriceInput, setMinPriceInput] = React.useState("");
        React.useEffect(() => {
          if (!selectedSeat) { setMinPriceInput(""); return; }
          setMinPriceInput(String(Number(selectedSeat.minPrice || 0)));
        }, [selectedSeatId, selectedSeat?.minPrice]);

        const saveMinPrice = async () => {
          if (!selectedSeat) return;
          const v = roundUpTo10(minPriceInput);
          await updateSeat(selectedSeat.id, { minPrice: v });
          toast(setToastMsg, `최소 가격 설정: ${seatDisplayText(selectedSeat)} → ₩${v}`);
        };

        return (
          <div className="max-w-6xl mx-auto px-4 pb-10">
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4">
              <div>
                <div className="flex items-center gap-2">
                  <div className="text-xl font-black">관리자 대시보드</div>
                  <StatusBadge status={room.status} />
                  <span className={`px-3 py-1 rounded-full text-xs font-black ${auctionEnabled ? 'bg-emerald-200 text-emerald-900' : 'bg-stone-200 text-stone-700'}`}>
                    경매 {auctionEnabled ? 'ON' : 'OFF'}
                  </span>
                </div>
                <div className="text-sm text-stone-600 mt-1">교실 코드: <span className="font-mono font-black">{roomCode}</span></div>
              </div>
              <div className="flex gap-2">
                <button onClick={() => { setScreen('home'); setRoomCode(''); }} className="px-4 py-2 rounded-xl bg-stone-200 hover:bg-stone-300 font-black">나가기</button>
              </div>
            </div>

            <div className="grid lg:grid-cols-3 gap-5">
              <div className="lg:col-span-2">
                <SeatCanvas
                  isAdmin={true}
                  seats={seats}
                  selectedSeatId={selectedSeatId}
                  setSelectedSeatId={setSelectedSeatId}
                  onSeatClick={async (sid) => {
                    if (adminAssignEnabled) {
                      await adminAssignSeat(sid);
                      return true;
                    }
                    return false;
                  }}
                  onSeatMoveToCell={async (sid, pos) => updateSeat(sid, pos)}
                  onSeatSwap={swapSeats}
                  editable={room.status === 'lobby'}
                  height={560}
                  auctionEnabled={auctionEnabled}
                  currentUid={user?.uid}
                />

                <div className="mt-4 grid md:grid-cols-2 gap-4">
                  <Card title="티켓팅" right={<div className="text-xs text-stone-600">정원 {seatCount}명</div>}>
                    <div className="text-sm text-stone-700">
                      입장: <span className="font-black">{joinedCount}</span> / {seatCount}명
                      <span className="mx-2">·</span>
                      책상: <span className="font-black">{seatCount}</span>개
                    </div>

                    <div className="mt-3 flex flex-wrap gap-2">
                      <button
                        onClick={toggleAuction}
                        className={`px-4 py-2 rounded-xl font-black ${auctionEnabled ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-stone-200 hover:bg-stone-300'}`}
                      >
                        경매 모드 {auctionEnabled ? 'ON' : 'OFF'}
                      </button>
                    </div>

                    {room.status === 'lobby' && (
                      <div className="mt-4 flex flex-wrap gap-2">
                        <button
                          onClick={startTicketing}
                          className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black"
                        >
                          배치 시작 (10초 카운트)
                        </button>
                        <button
                          onClick={autoLayout}
                          className="px-4 py-2 rounded-xl bg-stone-200 hover:bg-stone-300 font-black"
                        >
                          자동 배치
                        </button>
                      </div>
                    )}

                    {room.status === 'countdown' && (
                      <div className="mt-4">
                        <div className="text-3xl font-black text-amber-700">{countdownLeft ?? room.countdownSeconds ?? 10}s</div>
                        <div className="text-sm text-stone-700 mt-1">0초가 되면 자동으로 자리 선택이 열립니다.</div>
                        <div className="mt-3 flex gap-2">
                          <button onClick={openSeatingNow} className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-black">지금 열기</button>
                        </div>
                      </div>
                    )}

                    {room.status === 'seating' && (
                      <div className="mt-4 flex gap-2">
                        <button onClick={pauseSeating} className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-black">
                          배치 종료(일시정지)
                        </button>
                      </div>
                    )}

                    {room.status === 'paused' && (
                      <div className="mt-4">
                        <div className="text-sm text-stone-700 mb-3">일시정지 중입니다. (현 상태 유지)</div>
                        <div className="flex gap-2 flex-wrap">
                          <button onClick={resumeSeating} className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black">
                            배치 시작(재개)
                          </button>
                        </div>
                      </div>
                    )}
                  </Card>

                  <Card title="관리자 자리 조정">
                    <div className="text-sm text-stone-700">
                      1) 학생을 선택 → 2) 교실에서 책상을 클릭하면 해당 자리로 이동합니다.
                    </div>
                    <div className="mt-3 flex items-center gap-2">
                      <button
                        onClick={() => setAdminAssignEnabled((v) => !v)}
                        className={`px-4 py-2 rounded-xl font-black ${adminAssignEnabled ? 'bg-amber-500 text-white' : 'bg-stone-200 hover:bg-stone-300'}`}
                      >
                        {adminAssignEnabled ? '이동 모드 ON' : '이동 모드 OFF'}
                      </button>
                      <div className="text-xs text-stone-500">(이동 모드 ON일 때만 클릭 이동)</div>
                    </div>

                    <div className="mt-3">
                      <label className="text-sm font-bold">학생 선택</label>
                      <select
                        value={adminSelectedStudentUid || ''}
                        onChange={(e) => setAdminSelectedStudentUid(e.target.value || null)}
                        className="mt-2 w-full px-3 py-2 rounded-xl border border-stone-200"
                      >
                        <option value="">선택하세요</option>
                        {Object.values(students || {}).map((s) => (
                          <option key={s.id} value={s.id}>{s.name} ({genderLabel(s.gender)})</option>
                        ))}
                      </select>
                    </div>

                    <div className="mt-3 text-xs text-stone-500">
                      * 자리 제한(남/여 전용)은 학생 선택에는 적용되지만, 관리자는 필요 시 강제로 이동시킬 수 있습니다.
                    </div>
                  </Card>
                </div>
              </div>

              <div className="lg:col-span-1 space-y-5">
                <Card title="자리 편집 (대기중에만 가능)" right={<div className="text-xs text-stone-600">현재: {room.status}</div>}>
                  <div className="text-sm text-stone-700">대기중(lobby)일 때만 “클릭 이동/스왑”으로 배치를 바꿀 수 있어요.</div>
                  <div className="mt-4 flex flex-wrap gap-2">
                    <button
                      onClick={addSeat}
                      disabled={room.status !== 'lobby'}
                      className="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 disabled:opacity-50 text-white font-black"
                    >
                      책상 추가
                    </button>
                  </div>

                  <div className="mt-4 p-4 rounded-xl bg-stone-50 border border-stone-200">
                    <div className="text-sm font-black">선택된 책상</div>
                    {selectedSeat ? (
                      <div className="mt-2">
                        <div className="text-sm text-stone-700">
                          번호: <span className="font-black">{seatDisplayText(selectedSeat)}</span>
                        </div>
                        <div className="text-sm text-stone-700">
                          제한: <span className="font-black">{restrictionMeta[selectedSeat.restriction || 'A']?.label}</span>
                        </div>

                        <div className="mt-3">
                          <div className="text-sm font-black text-stone-700">경매 최소 가격(교사 설정)</div>
                          <div className="mt-2 flex gap-2">
                            <input
                              value={minPriceInput}
                              onChange={(e) => setMinPriceInput(e.target.value)}
                              className="w-full px-3 py-2 rounded-xl border border-stone-200 font-black"
                              inputMode="numeric"
                              placeholder="예: 100"
                            />
                            <button
                              onClick={saveMinPrice}
                              className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black"
                            >
                              저장
                            </button>
                          </div>
                          <div className="mt-1 text-xs text-stone-500">* 10단위로 자동 보정됩니다.</div>
                        </div>

                        <div className="mt-3 flex flex-wrap gap-2">
                          <button
                            onClick={() => cycleRestriction(selectedSeat.id)}
                            disabled={room.status !== 'lobby'}
                            className="px-4 py-2 rounded-xl bg-stone-200 hover:bg-stone-300 disabled:opacity-50 font-black"
                          >
                            제한 변경 (공용→남→여)
                          </button>
                          <button
                            onClick={() => deleteSeat(selectedSeat.id)}
                            disabled={room.status !== 'lobby'}
                            className="px-4 py-2 rounded-xl bg-rose-200 hover:bg-rose-300 disabled:opacity-50 font-black"
                          >
                            삭제
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="mt-2 text-sm text-stone-500">책상을 클릭해 선택하세요.</div>
                    )}
                  </div>
                </Card>

                <Card title="입장한 학생 목록" right={<div className="text-xs text-stone-600">{joinedCount}명</div>}>
                  <div className="space-y-2 max-h-[360px] overflow-auto pr-1">
                    {Object.values(students || {}).map((s) => {
                      const seatObj = Object.values(seats || {}).find((x) => x.occupiedBy === s.id) || null;
                      return (
                        <div key={s.id} className="p-3 rounded-xl bg-stone-50 border border-stone-200">
                          <div className="flex items-center justify-between">
                            <div className="font-black">{s.name}</div>
                            <div className="text-xs font-black px-2 py-0.5 rounded-full bg-stone-200">{genderLabel(s.gender)}</div>
                          </div>
                          <div className="text-xs text-stone-600 mt-1">
                            자리: {seatObj ? <span className="font-black">{seatDisplayText(seatObj)}</span> : '미배정'}
                            {seatObj && room.auctionEnabled ? <span className="ml-2 font-black text-emerald-700">₩{Number(seatObj.price || 0) || Number(seatObj.minPrice || 0)}</span> : null}
                          </div>
                        </div>
                      );
                    })}
                    {joinedCount === 0 && <div className="text-sm text-stone-500">아직 입장한 학생이 없습니다.</div>}
                  </div>
                </Card>
              </div>
            </div>
          </div>
        );
      };

      const StudentRoom = () => {
        if (roomLoading) {
          return (
            <div className="max-w-3xl mx-auto px-4 pb-10">
              <div className="text-center py-10 text-stone-600">불러오는 중...</div>
            </div>
          );
        }
        if (!room) {
          return (
            <div className="max-w-3xl mx-auto px-4 pb-10">
              <Card title="교실을 찾기 못했습니다">
                <div className="text-stone-700">교실 코드({roomCode})가 존재하지 않습니다.</div>
                <button onClick={() => { setScreen('home'); setRoomCode(''); }} className="mt-4 px-4 py-2 rounded-xl bg-stone-200 hover:bg-stone-300 font-black">홈으로</button>
              </Card>
            </div>
          );
        }

        const auctionEnabled = room.auctionEnabled === true;

        // ✅ 모달 좌석 안정화: seats에서 못 찾는 순간이 있어도 last ref로 유지
        const liveSeat = auctionSeatId ? seats?.[auctionSeatId] : null;
        const stableSeat = liveSeat || lastAuctionSeatRef.current || null;
        const minBid = stableSeat ? computeMinBid(stableSeat) : 0;

        return (
          <div className="max-w-6xl mx-auto px-4 pb-10">
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4">
              <div>
                <div className="flex items-center gap-2">
                  <div className="text-xl font-black">학생 화면</div>
                  <StatusBadge status={room.status} />
                  <span className={`px-3 py-1 rounded-full text-xs font-black ${auctionEnabled ? 'bg-emerald-200 text-emerald-900' : 'bg-stone-200 text-stone-700'}`}>
                    경매 {auctionEnabled ? 'ON' : 'OFF'}
                  </span>
                </div>
                <div className="text-sm text-stone-600 mt-1">
                  교실 코드: <span className="font-mono font-black">{roomCode}</span>
                  <span className="mx-2">·</span>
                  내 이름: <span className="font-black">{me?.name ?? studentName}</span> ({genderLabel(me?.gender ?? studentGender)})
                </div>
              </div>
              <div className="flex gap-2">
                <button onClick={() => { setScreen('home'); setRoomCode(''); }} className="px-4 py-2 rounded-xl bg-stone-200 hover:bg-stone-300 font-black">나가기</button>
              </div>
            </div>

            {room.status === 'lobby' && (
              <Card title="대기 중">
                <div className="text-stone-700">관리자가 배치 시작 버튼을 누를 때까지 기다려주세요.</div>
                <div className="mt-2 text-sm text-stone-600">입장 인원: {joinedCount} / {seatCount}명</div>
              </Card>
            )}

            {room.status === 'countdown' && (
              <Card title="곧 시작합니다!">
                <div className="text-stone-700">10초 뒤에 교실 화면이 열리고 자리 선택이 가능합니다.</div>
                <div className="mt-3 text-4xl font-black text-amber-700">{countdownLeft ?? room.countdownSeconds ?? 10}s</div>
              </Card>
            )}

            {room.status === 'paused' && (
              <Card title="일시정지 중">
                <div className="text-stone-700">지금은 일시정지 상태라 자리를 선택/변경할 수 없습니다. 선생님이 다시 시작하면 선택할 수 있어요.</div>
              </Card>
            )}

            {(room.status === 'seating' || room.status === 'paused') && (
              <div className="grid lg:grid-cols-3 gap-5 mt-5">
                <div className="lg:col-span-2">
                  <SeatCanvas
                    isAdmin={false}
                    seats={seats}
                    selectedSeatId={selectedSeatId}
                    setSelectedSeatId={setSelectedSeatId}
                    onSeatClick={async (sid) => {
                      if (room.status !== 'seating') return;
                      if (auctionEnabled) {
                        await openAuctionForSeat(sid);
                        return;
                      }
                      await studentPickSeat(sid);
                    }}
                    editable={false}
                    height={560}
                    auctionEnabled={auctionEnabled}
                    currentUid={user?.uid}
                  />
                </div>

                <div className="lg:col-span-1 space-y-5">
                  <Card title="내 자리">
                    <div className="text-sm text-stone-700">현재 선택된 자리</div>
                    <div className="mt-2 text-2xl font-black">
                      {mySeatId ? seatDisplayText(seats?.[mySeatId] || { x: 0, y: 0 }) : '미선택'}
                    </div>

                    {auctionEnabled && mySeatId ? (
                      <div className="mt-2 text-sm text-stone-700">
                        내 가격: <span className="font-black text-emerald-700">₩{Number(seats?.[mySeatId]?.price || 0)}</span>
                      </div>
                    ) : null}

                    <div className="mt-2 text-xs text-stone-500">
                      {room.status !== 'seating'
                        ? '일시정지 중에는 선택/변경이 불가합니다.'
                        : (auctionEnabled ? '경매 모드: 다른 책상을 클릭해 입찰할 수 있어요.' : '자리를 바꾸고 싶으면 다른 책상을 클릭하세요.')}
                    </div>
                  </Card>

                  <Card title="자리 색상 안내">
                    <div className="space-y-2 text-sm">
                      <div className="flex items-center gap-2"><span className="w-4 h-4 rounded bg-[#CFEFFF] border border-sky-300"></span><span className="font-bold">파랑(남):</span> 남학생만</div>
                      <div className="flex items-center gap-2"><span className="w-4 h-4 rounded bg-[#FFD7E8] border border-pink-300"></span><span className="font-bold">분홍(여):</span> 여학생만</div>
                      <div className="flex items-center gap-2"><span className="w-4 h-4 rounded bg-[#FFF2B2] border border-amber-200"></span><span className="font-bold">노랑(공용):</span> 모두 가능</div>
                    </div>
                  </Card>

                  <Card title="현재 입장 인원">
                    <div className="text-sm text-stone-700">{joinedCount} / {seatCount}명</div>
                  </Card>

                  {auctionEnabled && (
                    <Card title="경매 안내">
                      <div className="text-sm text-stone-700">
                        - 자리를 사려면 <span className="font-black">최소입찰 이상</span>으로 입찰해야 해요.<br/>
                        - 누군가 이미 산 자리라면 다음 사람은 <span className="font-black">+10 이상</span>이어야 해요.<br/>
                        - 한 자리에는 동시에 1명만 입찰할 수 있어요(잠금).
                      </div>
                    </Card>
                  )}
                </div>
              </div>
            )}

            {/* ✅ 모달은 auctionOpen이면 유지(좌석이 순간 undefined되어도 리마운트 방지) */}
            {auctionOpen && (
              <AuctionModal
                seat={stableSeat}
                minBid={minBid}
                initialBid={initialBidRef.current || minBid}
                expiresAtMillis={stableSeat?.bidLock?.expiresAt?.toMillis?.() ?? null}
                busy={auctionBusy}
                onCancel={async () => { await closeAuction(); }}
                onSubmit={async (bidStr) => {
                  if (auctionBusy) return;

                  // ✅ 최종 로컬 검증(추가 안전)
                  const bidNum = Number(bidStr);
                  if (!Number.isFinite(bidNum) || bidNum <= 0) return;
                  if (bidNum % 10 !== 0) return;
                  if (bidNum < minBid) return;

                  setAuctionBusy(true);
                  try {
                    await submitSeatBid(stableSeat?.id || auctionSeatId, bidStr);
                    toast(setToastMsg, '경매 구매 완료!');
                    setAuctionOpen(false);
                    setAuctionSeatId(null);
                  } catch (e) {
                    // ✅ 실패해도 busy는 반드시 풀려서 “먹통” 방지
                    if (e?.message === 'BID_TOO_LOW') {
                      // 서버에서 가격이 올라간 케이스
                      await alertModal('입찰 실패', `입찰 금액이 최소입찰보다 작습니다.\n현재 최소입찰: ${minBid}`);
                    } else if (e?.message === 'NO_LOCK') {
                      await alertModal('입찰 실패', '입찰 잠금이 없습니다. 다시 좌석을 클릭해 주세요.');
                    } else if (e?.message === 'NOT_SEATING') {
                      await alertModal('입찰 실패', '지금은 입찰할 수 없어요.');
                    } else {
                      // 기타
                      await alertModal('입찰 실패', '입찰에 실패했어요. 다시 시도해 주세요.');
                    }
                  } finally {
                    setAuctionBusy(false);
                  }
                }}
              />
            )}
          </div>
        );
      };

      // screen routing
      let body = null;
      if (screen === 'home') body = <Home />;
      else if (screen === 'adminCreate') body = (
        <AdminCreateView
          adminRoomCode={adminRoomCode}
          setAdminRoomCode={setAdminRoomCode}
          setScreen={setScreen}
          createRoom={createRoom}
          user={user}
        />
      );
      else if (screen === 'studentJoin') body = (
        <StudentJoinView
          joinRoomCode={joinRoomCode}
          setJoinRoomCode={setJoinRoomCode}
          studentName={studentName}
          setStudentName={setStudentName}
          studentGender={studentGender}
          setStudentGender={setStudentGender}
          ensureStudentDoc={ensureStudentDoc}
          setScreen={setScreen}
        />
      );
      else if (screen === 'adminRoom') body = <AdminRoom />;
      else if (screen === 'studentRoom') body = <StudentRoom />;

      return (
        <div className="min-h-screen">
          <TopBar />
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white px-4 py-2 rounded-full shadow-lg text-sm font-bold">
              {toastMsg}
            </div>
          )}
          {modal && (
            <Modal
              title={modal.title}
              message={modal.message}
              type={modal.type}
              onClose={(res) => closeModal(res)}
            />
          )}
          {body}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
