<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자리 티켓팅 프로그램 v2 (경매 모드 + 일시정지/재개) - 안정화</title>

  <link rel="icon" href="data:," />

  <!-- Tailwind (프로토타입) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel (프로토타입) -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .animate-fade-in { animation: fadeIn .2s ease-out forwards; }
    .no-select { user-select: none; -webkit-user-select: none; }
  </style>
</head>

<body class="bg-stone-100 text-stone-900">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getFirestore,
      Timestamp,
      doc,
      collection,
      setDoc,
      updateDoc,
      deleteDoc,
      getDoc,
      onSnapshot,
      serverTimestamp,
      runTransaction,
      query,
      orderBy,
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged,
      signInWithCustomToken,
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    let firebaseConfig;
    if (typeof window.__firebase_config !== 'undefined') {
      firebaseConfig = JSON.parse(window.__firebase_config);
    } else {
      firebaseConfig = {
        apiKey: "AIzaSyCTcI5JULAsWKUbcFWyWwK7ycqSebv65YE",
        authDomain: "seat-chagne.firebaseapp.com",
        projectId: "seat-chagne",
        storageBucket: "seat-chagne.firebasestorage.app",
        messagingSenderId: "1025998274608",
        appId: "1:1025998274608:web:372acadcadc112ebda6df5",
      };
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.__FB = {
      auth, db, Timestamp,
      doc, collection, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot,
      serverTimestamp, runTransaction, query, orderBy,
      signInAnonymously, onAuthStateChanged, signInWithCustomToken,
    };
  </script>

  <script type="text/babel" data-presets="env,react">
    /*******************************************************
     * Firebase
     *******************************************************/
    const {
      auth, db, Timestamp,
      doc, collection, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot,
      serverTimestamp, runTransaction, query, orderBy,
      signInAnonymously, onAuthStateChanged, signInWithCustomToken
    } = window.__FB;

    /*******************************************************
     * 작은 유틸
     *******************************************************/
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const nowMs = () => Date.now();

    // 6x5 고정 표(그리드) 설정
    const GRID_COLS = 6;
    const GRID_ROWS = 5;
    const CELL_W = 98;
    const CELL_H = 75;
    const GRID_MARGIN = 24;

    // 책상(좌석) 크기(표시용)
    const SEAT_W = 92;
    const SEAT_H = 74;

    // 경매 설정
    const DEFAULT_AUCTION_LOCK_MS = 15000; // 15초
    const BID_STEP = 10;

    const normalizeRoomCode = (s) => (s || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
    const isValidRoomCode = (s) => /^[A-Z0-9]{3,12}$/.test(s);

    const restrictionMeta = {
      A: { label: "공용", pill: "bg-stone-200 text-stone-700", seat: "bg-[#FFF2B2]", ring: "ring-stone-300" },
      M: { label: "남", pill: "bg-sky-200 text-sky-800", seat: "bg-[#CFEFFF]", ring: "ring-sky-300" },
      F: { label: "여", pill: "bg-pink-200 text-pink-800", seat: "bg-[#FFD7E8]", ring: "ring-pink-300" },
    };

    const genderLabel = (g) => (g === 'M' ? '남' : g === 'F' ? '여' : '미정');

    const toast = (setToast, msg) => {
      setToast(msg);
      setTimeout(() => setToast(null), 2200);
    };

    const roundUpTo10 = (n) => {
      const v = Number(n || 0);
      if (!Number.isFinite(v) || v <= 0) return 0;
      return Math.ceil(v / 10) * 10;
    };

    // ✅ 좌표(x,y) -> (row,col)
    const getCellFromXY = (x, y) => {
      const cx = (x ?? GRID_MARGIN) + SEAT_W / 2;
      const cy = (y ?? GRID_MARGIN) + SEAT_H / 2;
      const col = clamp(Math.floor((cx - GRID_MARGIN) / CELL_W), 0, GRID_COLS - 1);
      const row = clamp(Math.floor((cy - GRID_MARGIN) / CELL_H), 0, GRID_ROWS - 1);
      return { row, col };
    };

    // ✅ 표시 번호(1~30)
    const seatDisplayNo = (seat) => {
      const { row, col } = getCellFromXY(seat?.x, seat?.y);
      return row * GRID_COLS + col + 1;
    };
    const seatDisplayText = (seat) => `${seatDisplayNo(seat)}번`;

    const xyFromCell = (row, col) => ({
      x: GRID_MARGIN + col * CELL_W,
      y: GRID_MARGIN + row * CELL_H,
    });

    const isLockActive = (bidLock) => {
      if (!bidLock) return false;
      const ms = bidLock?.expiresAt?.toMillis?.() ?? null;
      if (!ms) return false;
      return ms > nowMs();
    };

    /*******************************************************
     * Modal
     *******************************************************/
    const Modal = ({ title, message, type = 'alert', onClose }) => {
      const isConfirm = type === 'confirm';
      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div className="mb-3">
              <h3 className="text-lg font-bold">{title}</h3>
            </div>
            <div className="text-stone-700 leading-relaxed whitespace-pre-line">{message}</div>
            <div className="mt-6 flex gap-3 justify-end">
              {isConfirm && (
                <button onClick={() => onClose(false)} className="px-4 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 font-bold">
                  취소
                </button>
              )}
              <button
                onClick={() => onClose(true)}
                className={`px-4 py-2 rounded-xl text-white font-bold ${isConfirm ? 'bg-amber-500 hover:bg-amber-600' : 'bg-sky-600 hover:bg-sky-700'}`}
              >
                확인
              </button>
            </div>
          </div>
        </div>
      );
    };

    /*******************************************************
     * Auction Modal (✅ 로컬 state로 입력 관리 + 깜빡임 최소화)
     *******************************************************/
    function AuctionModal({
      seat,
      minBid,
      initialBid,
      expiresAtMillis,
      busy,
      onCancel,
      onSubmit,
    }) {
      const [localBid, setLocalBid] = React.useState(String(initialBid ?? ""));
      const [error, setError] = React.useState(null);
      const [leftSec, setLeftSec] = React.useState(0);

      // ✅ 새 좌석을 열었을 때만 초기값 리셋
      React.useEffect(() => {
        setLocalBid(String(initialBid ?? ""));
        setError(null);
      }, [seat?.id, initialBid]);

      // ✅ 모달 내부 1초 타이머(부모 전체 리렌더 유발 X)
      React.useEffect(() => {
        if (!expiresAtMillis) { setLeftSec(0); return; }

        const tick = () => {
          const left = Math.max(0, Math.ceil((expiresAtMillis - Date.now()) / 1000));
          setLeftSec(left);
        };

        tick();
        const t = setInterval(tick, 1000);
        return () => clearInterval(t);
      }, [expiresAtMillis]);

      const shownPrice =
        Number(seat?.price || 0) > 0 ? Number(seat.price || 0) : Number(seat?.minPrice || 0);

      const onClickSubmit = () => {
        if (busy) return;

        const bidNum = Number(localBid);
        if (!Number.isFinite(bidNum) || bidNum <= 0) {
          setError('입찰 금액을 숫자로 입력해주세요.');
          return;
        }
        if (bidNum % 10 !== 0) {
          setError('입찰 금액은 10단위로 입력해주세요. (예: 100, 110, 120)');
          return;
        }
        if (bidNum < Number(minBid || 0)) {
          setError(`입찰 금액이 너무 낮아요. 최소 입찰은 ${minBid}원 입니다.`);
          return;
        }

        setError(null);
        onSubmit(String(bidNum));
      };

      return (
        // ✅ 경매 모달은 animate-fade-in 제거(리마운트/재생성 감지되면 깜빡임 유발)
        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div className="flex items-start justify-between gap-3">
              <div>
                <div className="text-lg font-black">자리 경매</div>
                <div className="text-sm text-stone-600 mt-1">
                  {seat ? `${seatDisplayText(seat)} 자리` : ''}
                </div>
              </div>
              <button
                onClick={onCancel}
                className="px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 font-black"
                title="닫기"
                disabled={busy}
              >
                ✕
              </button>
            </div>

            <div className="mt-4 p-4 rounded-2xl bg-stone-50 border border-stone-200">
              <div className="text-sm text-stone-700">
                현재 소유: <span className="font-black">{seat?.occupiedName ? seat.occupiedName : '없음(빈자리)'}</span>
              </div>
              <div className="text-sm text-stone-700 mt-1">
                현재 표시 가격: <span className="font-black">₩{shownPrice}</span>
              </div>
              <div className="text-sm text-stone-700 mt-1">
                현재 가격(price): <span className="font-black">{Number(seat?.price || 0)}</span>
              </div>
              <div className="text-sm text-stone-700 mt-1">
                최소가격(교사 설정): <span className="font-black">{Number(seat?.minPrice || 0)}</span>
              </div>
              <div className="text-sm text-stone-700 mt-1">
                이번 최소입찰: <span className="font-black text-emerald-700">{Number(minBid)}</span>
                <span className="text-xs text-stone-500 ml-2">(10단위)</span>
              </div>
              <div className="text-xs text-stone-500 mt-2">
                잠금 남은 시간: <span className="font-black">{leftSec}s</span>
              </div>
            </div>

            <div className="mt-4">
              <label className="text-sm font-bold">내 입찰 금액</label>
              <input
                value={localBid}
                onChange={(e) => { setError(null); setLocalBid(e.target.value.replace(/[^\d]/g, '')); }}
                placeholder={String(initialBid ?? '')}
                className="mt-2 w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-emerald-300 font-black"
                inputMode="numeric"
                disabled={busy}
              />

              <div className="mt-3 flex flex-wrap gap-2">
                <button
                  className="px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 font-black"
                  onClick={() => { setError(null); setLocalBid(String(minBid)); }}
                  disabled={busy}
                >
                  최소({minBid})
                </button>
                <button
                  className="px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 font-black"
                  onClick={() => { setError(null); setLocalBid(String(roundUpTo10((Number(localBid || 0)) + 10))); }}
                  disabled={busy}
                >
                  +10
                </button>
                <button
                  className="px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 font-black"
                  onClick={() => { setError(null); setLocalBid(String(roundUpTo10((Number(localBid || 0)) + 50))); }}
                  disabled={busy}
                >
                  +50
                </button>
              </div>

              {error && (
                <div className="mt-3 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm font-bold whitespace-pre-line">
                  {error}
                </div>
              )}
            </div>

            <div className="mt-6 flex gap-3 justify-end">
              <button
                onClick={onCancel}
                className="px-4 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 font-black"
                disabled={busy}
              >
                취소
              </button>
              <button
                onClick={onClickSubmit}
                className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black disabled:opacity-50"
                disabled={busy}
              >
                입찰/구매하기
              </button>
            </div>

            <div className="mt-3 text-xs text-stone-500">
              * 다른 학생이 입찰 중인 자리는 잠금이 풀리기 전까지 선택할 수 없습니다.
            </div>
          </div>
        </div>
      );
    }

    /*******************************************************
     * Hooks: room subscriptions
     *******************************************************/
    function useRoomData(roomCode) {
      const [room, setRoom] = React.useState(null);
      const [seats, setSeats] = React.useState({});
      const [students, setStudents] = React.useState({});
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        if (!roomCode) return;
        setLoading(true);

        const roomRef = doc(db, 'rooms', roomCode);
        const seatsRef = collection(db, 'rooms', roomCode, 'seats');
        const studentsRef = collection(db, 'rooms', roomCode, 'students');

        const unsubRoom = onSnapshot(
          roomRef,
          (snap) => setRoom(snap.exists() ? { id: snap.id, ...snap.data() } : null),
          (err) => { console.error("room snapshot error", err); setRoom(null); setLoading(false); }
        );

        const unsubSeats = onSnapshot(
          query(seatsRef, orderBy('createdAt', 'asc')),
          (snap) => {
            const m = {};
            snap.forEach((d) => (m[d.id] = { id: d.id, ...d.data() }));
            setSeats(m);
          },
          (err) => { console.error("seats snapshot error", err); setSeats({}); setLoading(false); }
        );

        const unsubStudents = onSnapshot(
          query(studentsRef, orderBy('joinedAt', 'asc')),
          (snap) => {
            const m = {};
            snap.forEach((d) => (m[d.id] = { id: d.id, ...d.data() }));
            setStudents(m);
            setLoading(false);
          },
          (err) => { console.error("students snapshot error", err); setLoading(false); }
        );

        return () => {
          unsubRoom();
          unsubSeats();
          unsubStudents();
        };
      }, [roomCode]);

      return { room, seats, students, loading };
    }

    /*******************************************************
     * UI 컴포넌트
     *******************************************************/
    function Card({ title, children, right }) {
      return (
        <div className="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
          <div className="px-5 py-4 border-b border-stone-200 flex items-center justify-between">
            <div className="font-black">{title}</div>
            {right}
          </div>
          <div className="p-5">{children}</div>
        </div>
      );
    }

    function Door({ position = "top" }) {
      return (
        <div
          className={[
            "absolute",
            position === "top" ? "top-8" : "bottom-8",
            "right-6",
            "w-[44px] h-[86px] rounded-xl",
            "bg-[#C89B7B] shadow-md border-2 border-[#B98A6B]",
            "flex items-center justify-center"
          ].join(" ")}
          title="문"
        >
          <div className="w-[34px] h-[72px] rounded-lg bg-[#E2B695] border border-[#B98A6B] relative">
            <div className="absolute right-2 top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-[#6B4B3A]"></div>
          </div>
        </div>
      );
    }

    const SeatTile = React.memo(function SeatTile({
      seat,
      isSelected,
      isPending,
      onClick,
      auctionEnabled,
      currentUid,
    }) {
      const meta = restrictionMeta[seat.restriction || 'A'] || restrictionMeta.A;
      const occupied = !!seat.occupiedBy;
      const name = seat.occupiedName || '';

      const lockActive = auctionEnabled && isLockActive(seat.bidLock);
      const lockedByOther = lockActive && seat?.bidLock?.uid && seat.bidLock.uid !== currentUid;

      const ringCls = isPending
        ? "ring-4 ring-emerald-500 scale-[1.03]"
        : isSelected
          ? "ring-4 ring-emerald-400 scale-[1.03]"
          : lockedByOther
            ? "ring-4 ring-rose-300"
            : "ring-2 ring-transparent hover:ring-2 hover:ring-stone-300";

      const shownPrice =
        Number(seat?.price || 0) > 0 ? Number(seat.price || 0) : Number(seat?.minPrice || 0);

      return (
        <button
          type="button"
          onClick={(e) => { e.stopPropagation(); onClick?.(); }}
          className={[
            "no-select",
            "w-[92px] h-[74px]",
            "rounded-2xl",
            "shadow-sm",
            "transition-all",
            "flex flex-col items-center justify-center",
            meta.seat,
            ringCls,
            lockedByOther ? "opacity-70 cursor-not-allowed" : "",
          ].join(" ")}
          disabled={lockedByOther}
          title={lockedByOther ? "다른 학생이 입찰 중" : ""}
        >
          <div className="text-[11px] font-black text-stone-700">
            {seatDisplayText(seat)}
          </div>

          <div className={["mt-1 text-[12px] font-black", occupied ? "text-stone-900" : "text-amber-700"].join(" ")}>
            {occupied ? name : "빈자리"}
          </div>

          {occupied && (
            <div className="text-[11px] font-bold text-stone-600">{genderLabel(seat.occupiedGender)}</div>
          )}

          {auctionEnabled && (
            <div className="mt-0.5 text-[10px] font-black text-stone-700">
              ₩{shownPrice}
              {lockActive ? <span className="ml-1 text-rose-700">입찰중</span> : null}
            </div>
          )}
        </button>
      );
    });

    function SeatCanvas({
      isAdmin,
      seats,
      selectedSeatId,
      setSelectedSeatId,
      onSeatClick,
      onSeatSwap,
      onSeatMoveToCell,
      editable,
      height = 560,
      auctionEnabled,
      currentUid,
    }) {
      const [pendingMoveSeatId, setPendingMoveSeatId] = React.useState(null);

      const seatList = React.useMemo(() => Object.values(seats || {}), [seats]);

      const seatByCell = React.useMemo(() => {
        const m = new Map();
        for (const s of seatList) {
          const { row, col } = getCellFromXY(s.x, s.y);
          m.set(`${row},${col}`, s);
        }
        return m;
      }, [seatList]);

      const seatIdAtCell = React.useCallback((row, col) => {
        const s = seatByCell.get(`${row},${col}`);
        return s?.id ?? null;
      }, [seatByCell]);

      const handleCellClick = React.useCallback(async (row, col) => {
        if (!editable || !isAdmin) {
          setSelectedSeatId(null);
          return;
        }

        if (pendingMoveSeatId) {
          const targetSeatId = seatIdAtCell(row, col);

          if (targetSeatId && targetSeatId !== pendingMoveSeatId) {
            await onSeatSwap?.(pendingMoveSeatId, targetSeatId);
          } else {
            const pos = xyFromCell(row, col);
            await onSeatMoveToCell?.(pendingMoveSeatId, pos);
          }

          setPendingMoveSeatId(null);
          return;
        }

        setSelectedSeatId(null);
      }, [editable, isAdmin, pendingMoveSeatId, seatIdAtCell, onSeatSwap, onSeatMoveToCell, setSelectedSeatId]);

      const handleSeatClick = React.useCallback(async (seatId) => {
        if (isAdmin && editable) {
          const handled = await onSeatClick?.(seatId);
          if (handled) return;

          setPendingMoveSeatId((cur) => (cur === seatId ? null : seatId));
          setSelectedSeatId(seatId);
          return;
        }

        setSelectedSeatId(seatId);
        await onSeatClick?.(seatId);
      }, [isAdmin, editable, onSeatClick, setSelectedSeatId]);

      const gridStyle = {
        gridTemplateColumns: `repeat(${GRID_COLS}, ${CELL_W}px)`,
        gridTemplateRows: `repeat(${GRID_ROWS}, ${CELL_H}px)`,
        gap: "8px",
      };

      return (
        <div className="bg-white rounded-3xl shadow-sm border border-stone-200 overflow-hidden">
          <div className="bg-[#1F4D34] text-white px-6 py-6">
            <div className="max-w-5xl mx-auto text-center">
              <div className="tracking-[0.3em] text-2xl font-black">CHALK BOARD</div>
              <div className="mt-2 text-sm text-white/80 font-bold">
                {auctionEnabled ? "경매 모드: 더 높은 금액으로 자리 구매" : "원하는 자리를 선택하세요"}
              </div>
            </div>
          </div>

          <div className="bg-gradient-to-b from-[#f5f1ea] to-[#efe7dc] px-4 py-6">
            <div className="max-w-5xl mx-auto flex justify-center">
              <div className="w-[220px] h-[46px] rounded-b-2xl bg-[#8B6B5D] shadow-md flex items-center justify-center text-white font-black tracking-widest">
                TEACHER
              </div>
            </div>

            <div className="max-w-5xl mx-auto mt-5">
              <div className="relative rounded-[36px] bg-white/90 shadow-lg border border-white p-6 md:p-8">
                <Door position="top" />
                <Door position="bottom" />

                <div className="flex items-center justify-between mb-4">
                  <div className="font-black text-stone-700">교실</div>
                  <div className="text-xs text-stone-500 font-bold">
                    {editable && isAdmin
                      ? (pendingMoveSeatId
                        ? '✅ 책상 선택됨 → 빈 칸(또는 다른 책상)을 클릭하면 이동/스왑'
                        : '✅ 책상을 클릭해 선택 → 원하는 칸(또는 다른 책상)을 클릭')
                      : (auctionEnabled ? '경매 모드: 책상을 클릭해 입찰' : '책상을 클릭해 선택')}
                  </div>
                </div>

                <div className="w-full overflow-auto" style={{ height }}>
                  <div className="w-full flex justify-center">
                    <div className="relative">
                      <div className="grid" style={gridStyle}>
                        {Array.from({ length: GRID_ROWS }).map((_, r) =>
                          Array.from({ length: GRID_COLS }).map((__, c) => {
                            const seat = seatByCell.get(`${r},${c}`) || null;

                            return (
                              <div
                                key={`${r},${c}`}
                                className="flex items-center justify-center"
                                onClick={() => handleCellClick(r, c)}
                              >
                                {seat ? (
                                  <SeatTile
                                    seat={seat}
                                    isSelected={seat.id === selectedSeatId}
                                    isPending={seat.id === pendingMoveSeatId}
                                    onClick={() => handleSeatClick(seat.id)}
                                    auctionEnabled={!!auctionEnabled}
                                    currentUid={currentUid}
                                  />
                                ) : (
                                  <div
                                    className={[
                                      "w-[92px] h-[74px] rounded-2xl",
                                      "border-2 border-dashed",
                                      editable && isAdmin ? "border-stone-300 hover:border-emerald-400 hover:bg-emerald-50/40 cursor-pointer" : "border-transparent",
                                    ].join(" ")}
                                    title={editable && isAdmin ? "여기로 이동" : ""}
                                  />
                                )}
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            </div>

          </div>
        </div>
      );
    }

    /*******************************************************
     * 뷰들
     *******************************************************/
